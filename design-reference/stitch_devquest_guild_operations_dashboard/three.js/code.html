<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>
    <!-- STITCH_THREEJS_START:ANIMATION_3 class="fixed inset-0 w-full h-full bg-transparent" -->
    <div class="fixed inset-0 h-full w-full bg-transparent" style="display: block">
      <script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
      <div id="threejs-container-ANIMATION_3" style="width: 100%; height: 100%"></div>
      <script>
        (function () {
          const container = document.getElementById("threejs-container-ANIMATION_3");
          const devicePixelRatio = window.devicePixelRatio || 1;
          const width = container.clientWidth || window.innerWidth;
          const height = container.clientHeight || window.innerHeight;

          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
          const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
          renderer.setSize(width, height);
          container.appendChild(renderer.domElement);

          // Abstract 3D Geometric "Core" representing Project Progress
          const group = new THREE.Group();
          scene.add(group);

          const coreGeometry = new THREE.IcosahedronGeometry(1.5, 0);
          const coreMaterial = new THREE.MeshPhongMaterial({
            color: 0x3b82f6,
            wireframe: true,
            transparent: true,
            opacity: 0.8,
          });
          const core = new THREE.Mesh(coreGeometry, coreMaterial);
          group.add(core);

          const innerGeometry = new THREE.IcosahedronGeometry(0.8, 0);
          const innerMaterial = new THREE.MeshStandardMaterial({
            color: 0x8b5cf6,
            emissive: 0x8b5cf6,
            emissiveIntensity: 0.5,
            metalness: 0.5,
            roughness: 0.2,
          });
          const inner = new THREE.Mesh(innerGeometry, innerMaterial);
          group.add(inner);

          const light = new THREE.PointLight(0x3b82f6, 2, 100);
          light.position.set(5, 5, 5);
          scene.add(light);

          const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
          scene.add(ambientLight);

          camera.position.z = 5;

          function animate() {
            requestAnimationFrame(animate);
            core.rotation.x += 0.005;
            core.rotation.y += 0.005;
            inner.rotation.x -= 0.01;
            inner.rotation.z += 0.01;
            renderer.render(scene, camera);
          }

          window.addEventListener("resize", () => {
            const w = container.clientWidth || window.innerWidth;
            const h = container.clientHeight || window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
          });

          animate();
        })();
      </script>
    </div>
    <!-- STITCH_THREEJS_END:ANIMATION_3 -->
  </body>
</html>
